name: macOS Flutter + VNC

on:
  workflow_dispatch:

jobs:
  macos-flutter:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Enable Screen Sharing (VNC)
        run: |
          sudo python3 -c "
          password = 'Flutter@123'[:8].ljust(8, chr(0))
          key = [23, 82, 107, 6, 35, 78, 88, 7]
          result = bytearray()
          for i, char in enumerate(password.encode('latin-1')):
              byte = char
              rev = 0
              for j in range(8):
                  rev = (rev << 1) | ((byte >> j) & 1)
              result.append(rev ^ key[i])
          with open('/Library/Preferences/.com.apple.VNCSettings.txt', 'wb') as f:
              f.write(bytes(result))
          "
          sudo defaults write /Library/Preferences/com.apple.RemoteDesktop VNCAlwaysStartOnConsolePort -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteDesktop VNCLegacyConnectionsAllowed -bool true
          sudo launchctl unload /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sleep 5
          echo "VNC Screen Sharing started!"

      - name: Install noVNC
        run: |
          pip3 install websockify --break-system-packages
          git clone https://github.com/novnc/noVNC.git ~/noVNC

      - name: Start noVNC
        run: |
          ~/noVNC/utils/novnc_proxy \
            --vnc localhost:5900 \
            --listen 6080 &
          sleep 3
          echo "noVNC started!"

      - name: Install Ngrok & Start HTTP Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          ngrok http 6080 --log=stdout > ngrok.log &
          sleep 5
          curl -s http://127.0.0.1:4040/api/tunnels | \
            python3 -c "
          import sys, json
          t = json.load(sys.stdin)['tunnels']
          addr = t[0]['public_url']
          print('==================================')
          print('  OPEN IN BROWSER:')
          print('  ' + addr + '/vnc.html')
          print('  PASSWORD: Flutter@123')
          print('==================================')
          "

      - name: Keep Session Alive
        run: sleep 21600
